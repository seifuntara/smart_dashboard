<div class="container-fluid mt-3">

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card shadow p-3">
        <h6>Spending by Category</h6>
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card shadow p-3">
        <h6>Monthly Spending Trend</h6>
        <canvas id="monthlyChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card shadow p-3 mt-4">
    <h6>What-If Analysis</h6>

    <label class="form-label">Select categories (hold Ctrl/Cmd to multi-select)</label>
    <select id="whatIfCategories" class="form-control mb-2" multiple size="4">
      <!-- populated dynamically -->
    </select>

    <div id="whatIfDeltasContainer" class="mb-2">
      <!-- per-category delta inputs will be added here -->
    </div>

    <button class="btn btn-primary" onclick="runWhatIf()">Simulate</button>

    <div id="whatIfResult" class="mt-3"></div>
  </div>

  <div class="card shadow p-3 mt-4">
    <h6>Transaction History</h6>

    <div class="table-responsive">
      <table class="table table-striped">
        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Merchant</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody id="transactionsTableBody"></tbody>
      </table>
    </div>
  </div>

</div>
